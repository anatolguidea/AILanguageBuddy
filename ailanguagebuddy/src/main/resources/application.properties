spring.application.name=ailanguagebuddy

# --- AI (Groq): set GROQ_API_KEY in environment ---
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant

# --- Database (Supabase): set DATASOURCE_URL in environment ---
spring.datasource.url=${DATASOURCE_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate & JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Security (Supabase JWT) ---
# Supabase issuer is: https://<project-ref>.supabase.co/auth/v1
# JWKS is:           https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
# Provide SUPABASE_URL in environment (same as frontend SUPABASE_URL).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL:}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL:}/auth/v1/.well-known/jwks.json
# Derived from user screenshot: Project uses ECC (ES256), handled via JWKS.
# app.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# --- CORS ---
# For dev you can leave '*' or set a comma-separated list of origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- WebSocket Security ---
# Comma-separated origins allowed to open /ws/voice. Wildcard '*' is rejected by config.
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}

# --- Voice Service ---
voice.service.url=${VOICE_SERVICE_URL:http://localhost:8000}

# --- Actuator + Observability ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=AI Language Buddy
info.app.version=1.0.0

# Prometheus scrape endpoint at /actuator/prometheus
management.prometheus.metrics.export.enabled=true

# OpenTelemetry tracing — 10% sample rate in prod; 100% in dev
management.tracing.sampling.probability=${OTEL_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Micrometer tag: service name propagates to Prometheus and OTLP
management.observations.key-values.service=ailanguagebuddy

# --- HikariCP Connection Pool ---
# Supabase free tier allows ~15 connections; leave headroom for migrations and seeders.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=TezaHikariPool
