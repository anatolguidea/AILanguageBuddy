spring.application.name=ailanguagebuddy

# --- AI (Groq): set GROQ_API_KEY in environment ---
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant

# --- Database (Supabase): set DATASOURCE_URL in environment ---
spring.datasource.url=${DATASOURCE_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate & JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Security (Supabase JWT) ---
# Supabase issuer is: https://<project-ref>.supabase.co/auth/v1
# JWKS is:           https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
# Provide SUPABASE_URL in environment (same as frontend SUPABASE_URL).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL:}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL:}/auth/v1/.well-known/jwks.json
# Derived from user screenshot: Project uses ECC (ES256), handled via JWKS.
# app.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# --- CORS ---
# For dev you can leave '*' or set a comma-separated list of origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- WebSocket Security ---
# Comma-separated origins allowed to open /ws/voice. Wildcard '*' is rejected by config.
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}
